name: Bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Gate enforcement (bench.gates, SLO/regression failure) is a documented follow-up, not run here.
      - name: Bench tests + latency report (report-only; SLO/regression gates not yet enforced)
        working-directory: engine
        run: |
          python -m pytest tests/bench/ -q
          python -m bench.latency_bench --reps 5 --warmup 1 --delay-ms 5 --report
