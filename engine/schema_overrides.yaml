glossary:
- term: cim:audit_account (account, change)
  maps_to: |-
    eventtype `cim:audit_account`: index=_audit sourcetype=audittrailv2* category=system data.type=account
- term: cim:audit_object (audit, change)
  maps_to: 'eventtype `cim:audit_object`: index=_audit sourcetype=audittrailv2* category=object'
- term: cim:audit_system (audit, change)
  maps_to: |-
    eventtype `cim:audit_system`: index=_audit sourcetype=audittrailv2* category=system NOT data.type=account
- term: cim:authentication (authentication)
  maps_to: 'eventtype `cim:authentication`: index=_audit sourcetype=audittrailv2* category=authn'
- term: splunkd-access
  maps_to: |-
    eventtype `splunkd-access`: index=_internal source=*/splunkd_access.log OR source=*\\splunkd_access.log
- term: splunkd-log
  maps_to: 'eventtype `splunkd-log`: index=_internal source=*/splunkd.log OR source=*\\splunkd.log'
- term: geoip enrichment
  maps_to: |-
    lookup `geo_attr_countries.csv` (columns: continent, country, iso2, iso3, region_un, region_wb, subregion)
investigation_patterns:
- name: datamodel_ATv2_Data_Model
  applies_to: Audit Trail v2 Data Model
  steps:
  - |-
    Use `| tstats <agg> from datamodel=ATv2_Data_Model by <field>` for fast, index-time aggregation instead of a raw search when the question fits this model.
  - 'Scope — indexes: _audit; sourcetypes: audittrailv2'
  - Acceleration NOT enabled — if not accelerated, tstats falls back to a normal search (slower).
- name: datamodel_internal_audit_logs
  applies_to: Splunk's Internal Audit Logs record user activity, including searches and configuration changes.
  steps:
  - |-
    Use `| tstats <agg> from datamodel=internal_audit_logs by <field>` for fast, index-time aggregation instead of a raw search when the question fits this model.
  - 'Scope — indexes: _audit'
  - Acceleration NOT enabled — if not accelerated, tstats falls back to a normal search (slower).
- name: datamodel_internal_server
  applies_to: Splunk's Internal Server Logs record information about system usage and performance.
  steps:
  - |-
    Use `| tstats <agg> from datamodel=internal_server by <field>` for fast, index-time aggregation instead of a raw search when the question fits this model.
  - 'Scope — indexes: _internal'
  - Acceleration NOT enabled — if not accelerated, tstats falls back to a normal search (slower).
eventtypes:
- name: cim:audit_account
  search: index=_audit sourcetype=audittrailv2* category=system data.type=account
  tags:
  - account
  - change
- name: cim:audit_object
  search: index=_audit sourcetype=audittrailv2* category=object
  tags:
  - audit
  - change
- name: cim:audit_system
  search: index=_audit sourcetype=audittrailv2* category=system NOT data.type=account
  tags:
  - audit
  - change
- name: cim:authentication
  search: index=_audit sourcetype=audittrailv2* category=authn
  tags:
  - authentication
- name: splunkd-access
  search: index=_internal source=*/splunkd_access.log OR source=*\\splunkd_access.log
- name: splunkd-log
  search: index=_internal source=*/splunkd.log OR source=*\\splunkd.log
macros:
- call: '`audit_searchlocal(filter)`'
  definition: |-
    search index=_audit action=search (id=* OR search_id=*) | eval search_id = if(isnull(search_id), id, search_id) | replace '*' with * in search_id | search $filter$
- call: '`audit_searchlocal`'
  definition: '`audit_searchlocal("search_id!=rt_*")`'
lookups:
- name: dnslookup
  type: external
  fields:
  - clienthost
  - clientip
  use_when: 'resolve IP→hostname or hostname→IP; key fields: clientip or clienthost'
- name: geo_attr_countries
  type: file
  fields:
  - country
  - region_wb
  - region_un
  - subregion
  - continent
  - iso2
  - iso3
  use_when: 'enrich country name with region/continent/ISO codes; key field: country'
- name: geo_attr_us_states
  type: file
  fields:
  - state_name
  - state_fips
  - state_code
  use_when: 'enrich US state abbreviation with full name and FIPS code; key field: state_code'
