# ─────────────────────────────────────────────────────────────────────────────
# Guardrail rules for generated SPL — the SOLE source of truth.
#
# There are NO code defaults. Both keys below are REQUIRED and loaded at startup;
# a missing/malformed file is a hard failure (the engine refuses to start).
# Applied at startup; restart the engine after editing.
#
# Path is configurable via GUARDRAILS_CONFIG_PATH (default: config/guardrails.yaml).
#
# Note: the "unknown index" check is driven by the live schema, not this file.
# ─────────────────────────────────────────────────────────────────────────────

# Max allowed time range (in days) for `earliest=`. Required, positive integer.
max_time_range_days: 90

# Resource-heavy / dangerous SPL patterns to block. Required (may be an empty
# list to disable resource-heavy blocking entirely). Each entry: a
# case-insensitive regex (`pattern`) and the user-facing `reason`. Invalid
# regexes are skipped (logged), never fatal.
resource_heavy_patterns:
  - pattern: '\|\s*join\b(?![^|]*\b(?:max|overwrite)\s*=)'
    reason: "Unbounded join — add max= or use stats instead"
  - pattern: '\|\s*collect\b(?!.*index=)'
    reason: "collect without target index"
  - pattern: '\|\s*delete\b'
    reason: "delete command not allowed"
  - pattern: '\|\s*outputlookup\b'
    reason: "outputlookup not allowed via agent"
  - pattern: '\|\s*script\b'
    reason: "script command not allowed — arbitrary execution"
  - pattern: '\|\s*runshell\b'
    reason: "runshell command not allowed — shell execution"
  - pattern: '\|\s*sendemail\b'
    reason: "sendemail not allowed via agent — outbound exfiltration risk"
  - pattern: '\|\s*rest\b'
    reason: "rest command not allowed via agent — reaches internal management endpoints"
  - pattern: '\|\s*sendalert\b'
    reason: "sendalert not allowed via agent — outbound side effect"
  - pattern: '\|\s*dbxquery\b'
    reason: "dbxquery not allowed via agent — arbitrary SQL against an external DB"
  - pattern: '\|\s*map\b'
    reason: "map not allowed via agent — runs an arbitrary subsearch per input row"
  - pattern: '\|\s*(mcollect|meventcollect)\b'
    reason: "mcollect/meventcollect not allowed via agent — writes to a metrics index"
  - pattern: '\|\s*outputcsv\b'
    reason: "outputcsv not allowed via agent — writes to the search head filesystem"
  - pattern: '\|\s*tscollect\b'
    reason: "tscollect not allowed via agent — writes a tsidx summary"
  - pattern: '\|\s*loadjob\b'
    reason: "loadjob not allowed via agent — loads another user's search results"
  - pattern: '\|\s*savedsearch\b'
    reason: "savedsearch not allowed via agent — may run with different, broader permissions"
